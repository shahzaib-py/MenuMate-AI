<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste Of Punjab - Customer Support</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 50%, #ffcc00 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #chat-container {
            width: 100%;
            max-width: 450px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        #header {
            background: linear-gradient(135deg, #2d5016 0%, #3d6b1e 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        #header h1 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 4px;
        }

        #header p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        #messages {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            background: #f8f9fa;
        }

        .message {
            margin: 12px 0;
            padding: 12px 16px;
            border-radius: 18px;
            max-width: 85%;
            line-height: 1.5;
            font-size: 0.95rem;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .user {
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 6px;
        }

        .bot {
            background: white;
            color: #333;
            margin-right: auto;
            border-bottom-left-radius: 6px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            white-space: pre-wrap;
        }

        .typing {
            display: none;
            padding: 12px 16px;
            background: white;
            border-radius: 18px;
            max-width: 80px;
            margin: 12px 0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }

        .typing span {
            display: inline-block;
            width: 8px;
            height: 8px;
            background: #ccc;
            border-radius: 50%;
            margin: 0 2px;
            animation: bounce 1.4s infinite ease-in-out;
        }

        .typing span:nth-child(1) { animation-delay: 0s; }
        .typing span:nth-child(2) { animation-delay: 0.2s; }
        .typing span:nth-child(3) { animation-delay: 0.4s; }

        @keyframes bounce {
            0%, 80%, 100% { transform: translateY(0); }
            40% { transform: translateY(-6px); }
        }

        #input-container {
            display: flex;
            padding: 15px;
            background: white;
            border-top: 1px solid #eee;
            gap: 10px;
        }

        #user-input {
            flex: 1;
            padding: 14px 18px;
            border: 2px solid #eee;
            border-radius: 25px;
            font-size: 1rem;
            font-family: 'Poppins', sans-serif;
            outline: none;
            transition: border-color 0.3s;
        }

        #user-input:focus {
            border-color: #ff6b35;
        }

        #send-btn {
            padding: 14px 24px;
            background: linear-gradient(135deg, #2d5016, #3d6b1e);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            font-family: 'Poppins', sans-serif;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        #send-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(45, 80, 22, 0.4);
        }

        #send-btn:active {
            transform: scale(0.98);
        }

        /* Scrollbar styling */
        #messages::-webkit-scrollbar {
            width: 6px;
        }

        #messages::-webkit-scrollbar-track {
            background: transparent;
        }

        #messages::-webkit-scrollbar-thumb {
            background: #ddd;
            border-radius: 3px;
        }

        #messages::-webkit-scrollbar-thumb:hover {
            background: #ccc;
        }
    </style>
</head>
<body>
    <div id="chat-container">
        <div id="header">
            <h1>Taste Of Punjab</h1>
            <p>Home-style Punjabi Food & Tiffin Service</p>
        </div>
        <div id="messages">
            <div class="message bot">Sat Sri Akal! Welcome to Taste Of Punjab. I'm here to help you with our menu, tiffin service, delivery info, or placing an order. How can I assist you today?</div>
        </div>
        <div class="typing" id="typing">
            <span></span><span></span><span></span>
        </div>
        <div id="input-container">
            <input type="text" id="user-input" placeholder="Ask about menu, tiffin, delivery..." />
            <button id="send-btn">Send</button>
        </div>
    </div>

    <script>
        const messagesContainer = document.getElementById('messages');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const typingIndicator = document.getElementById('typing');

        function appendMessage(text, sender) {
            const div = document.createElement('div');
            div.classList.add('message', sender);
            div.textContent = text;
            messagesContainer.appendChild(div);
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function showTyping() {
            typingIndicator.style.display = 'block';
            messagesContainer.scrollTop = messagesContainer.scrollHeight;
        }

        function hideTyping() {
            typingIndicator.style.display = 'none';
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (!message) return;

            // Show user message
            appendMessage(message, 'user');
            userInput.value = '';
            
            // Show typing indicator
            showTyping();

            // Send message to backend
            try {
                const response = await fetch('/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message })
                });
                const data = await response.json();
                hideTyping();
                appendMessage(data.reply, 'bot');
            } catch (err) {
                hideTyping();
                appendMessage("Sorry, I'm having trouble connecting. Please try again.", 'bot');
                console.error(err);
            }
        }

        sendBtn.addEventListener('click', sendMessage);
        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') sendMessage();
        });

        // Focus input on load
        userInput.focus();
    </script>
</body>
</html>
